{% extends "base.html" %}
{% block title %}Register - CareerConnect{% endblock %}
{% block content %}
<div class="container narrow">
  <div class="card-form auth-card">
    <h1>Register</h1>
    <form method="post" novalidate>
      <div class="role-picker">
        <label class="radio">
          <input type="radio" name="role" value="seeker" {% if request.form.get('role') != 'employer' %}checked{% endif %}>
          Job Seeker
        </label>
        <label class="radio">
          <input type="radio" name="role" value="employer">
          Employer
        </label>
      </div>
      <div id="company-field" class="hidden">
        <label>Company Name <span class="required">*</span>
          <input type="text" name="company" value="{{ request.form.get('company', '') }}">
        </label>
      </div>
      <label>Full Name <span class="required">*</span>
        <input type="text" name="name" required value="{{ request.form.get('name', '') }}">
      </label>
      <label>Email <span class="required">*</span>
        <input type="email" name="email" required value="{{ request.form.get('email', '') }}">
      </label>
      <label>Password <span class="required">*</span>
        <input type="password" name="password" minlength="6" required>
      </label>
      <label>Confirm Password <span class="required">*</span>
        <input type="password" name="confirm" required>
      </label>
      <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>
    <p class="auth-link">Already registered? <a href="{{ url_for('login') }}">Login here</a></p>
  </div>
</div>
{% endblock %}
