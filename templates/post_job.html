{% extends "base.html" %}
{% block title %}{{ 'Edit Job' if job else 'Post New Job' }} - CareerConnect{% endblock %}
{% block content %}
<div class="container narrow">
  <h1>{{ 'Edit Job' if job else 'Post New Job' }}</h1>
  <form method="post" class="card-form">
    <label>Job Title <span class="required">*</span>
      <input type="text" name="title" required value="{{ form.get('title', '') }}">
    </label>
    <label>Job Description <span class="required">*</span>
      <textarea name="description" rows="6" required>{{ form.get('description', '') }}</textarea>
    </label>
    <label>Location
      <input type="text" name="location" placeholder="e.g. Delhi / Remote" value="{{ form.get('location', '') }}">
    </label>
    <label>Salary (e.g. 4-6 LPA)
      <input type="text" name="salary" value="{{ form.get('salary', '') }}">
    </label>
    <label>Category
      <select name="category">
        <option value="">-- Select --</option>
        {% for c in categories %}
          <option value="{{ c['cat_name'] }}" {% if form.get('category') == c['cat_name'] %}selected{% endif %}>{{ c['cat_name'] }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Last Date to Apply
      <input type="date" name="last_date" min="{{ today }}" value="{{ form.get('last_date', '') }}">
    </label>
    <button type="submit" class="btn btn-primary">{{ 'Save Changes' if job else 'Post Job' }}</button>
  </form>
</div>
{% endblock %}
